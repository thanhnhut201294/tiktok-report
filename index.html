<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root{--primary:#ff0050;--secondary:#00f2ea;--yellow:#ffd900;--bg:#f0f4f8;--bd:#000;--white:#fff}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Be Vietnam Pro',sans-serif;padding:16px;background:var(--bg);color:var(--bd);background-image:radial-gradient(#dbe3ea 15%,transparent 16%);background-size:20px 20px}
    main{max-width:1200px;margin:0 auto;background:var(--white);padding:24px;border:3px solid var(--bd);box-shadow:8px 8px 0 var(--bd);border-radius:20px}
    h1{font-family:'Fredoka',sans-serif;text-align:center;color:var(--primary);font-size:2.2rem;text-shadow:3px 3px 0 var(--bd);margin-bottom:20px}
    #stats-board{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px}
    .stat-card{padding:12px;text-align:center;border:3px solid var(--bd);box-shadow:5px 5px 0 var(--bd);border-radius:14px;transition:transform .2s}
    .stat-card:hover{transform:translateY(-2px)}
    .stat-card:nth-child(1){background:#e0f7fa}.stat-card:nth-child(2){background:#fce4ec}.stat-card:nth-child(3){background:#fff9c4}.stat-card:nth-child(4){background:#f3e5f5}.stat-card:nth-child(5){background:#e8f5e9}
    .stat-title{font-size:12px;font-weight:700;text-transform:uppercase;margin-bottom:4px}
    .stat-value{font-size:22px;font-weight:800;margin-bottom:6px}
    .stat-avg{font-size:11px;font-weight:600;background:var(--bd);color:var(--white);display:inline-block;padding:3px 8px;border-radius:6px}
    label{font-weight:700;margin-bottom:8px;display:block;font-size:15px}
    textarea{width:100%;height:110px;padding:12px;font-size:14px;font-family:'Be Vietnam Pro',sans-serif;resize:vertical;border:3px solid var(--bd);box-shadow:4px 4px 0 var(--bd);border-radius:12px;outline:none;transition:.2s;margin-bottom:14px}
    textarea:focus{background:#fdffed;transform:translate(-1px,-1px);box-shadow:6px 6px 0 var(--primary)}
    .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
    button{padding:0 20px;height:46px;cursor:pointer;font-weight:700;font-size:14px;font-family:'Be Vietnam Pro',sans-serif;white-space:nowrap;display:flex;align-items:center;gap:6px;border:3px solid var(--bd);box-shadow:4px 4px 0 var(--bd);border-radius:10px;transition:all .1s}
    button:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--bd)}
    button:disabled{background:#ccc!important;color:#777!important;box-shadow:none!important;transform:translate(3px,3px);cursor:not-allowed}
    #fetchBtn{background:var(--primary);color:#fff}
    #fetchBtn:hover:not(:disabled){background:#ff3370}
    .btn-sec{background:var(--white)}.btn-sec:hover{background:#f0f0f0}
    .btn-excel{background:var(--secondary)}.btn-excel:hover{background:#33fff8}
    .btn-copy{background:var(--yellow)}.btn-copy:hover:not(:disabled){background:#ffe94d}
    #status{margin-bottom:16px;padding:12px 16px;border-radius:10px;font-weight:600;border:3px solid var(--bd);background:#fff;font-size:14px;min-height:46px}
    .log-process{background:#e3f2fd!important;color:#0d47a1}
    .log-done{background:#e8f5e9!important;color:#1b5e20}
    .log-error{background:#fce4ec!important;color:#b71c1c}
    #debug-log{background:#1a1a2e;color:#e0e0e0;border:2px solid var(--bd);border-radius:10px;padding:12px;font-family:monospace;font-size:11px;max-height:120px;overflow-y:auto;margin-bottom:14px;display:none}
    #debug-log .ok{color:#69ff47}#debug-log .fail{color:#ff6b6b}#debug-log .info{color:#87ceeb}
    .toggle-debug{font-size:12px;color:#666;cursor:pointer;margin-bottom:8px;display:inline-block;font-weight:600}
    .toggle-debug:hover{color:#000}
    .table-container{overflow-x:auto;border-radius:12px;border:3px solid var(--bd)}
    table{width:100%;border-collapse:collapse;min-width:900px;font-family:'Be Vietnam Pro',sans-serif}
    th{background:var(--secondary);color:var(--bd);font-weight:700;padding:12px;text-align:left;border-bottom:3px solid var(--bd);border-right:2px solid var(--bd);text-transform:uppercase;font-size:13px}
    td{border-bottom:2px solid var(--bd);border-right:2px solid var(--bd);padding:10px 12px;vertical-align:middle;font-weight:500;font-size:14px}
    tr:last-child td{border-bottom:none}th:last-child,td:last-child{border-right:none}
    tr:nth-child(even){background:#f9f9f9}tr:hover{background:#fffde7}
    .col-thumb img{width:42px;height:42px;object-fit:cover;border-radius:7px;border:2px solid var(--bd);background:#eee}
    .col-caption{max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .status-ok{color:#00c853;font-weight:800}.status-err{color:#d50000;font-weight:800}
    .col-link a{color:var(--primary);text-decoration:none;font-weight:700;border-bottom:2px solid transparent}
    .col-link a:hover{border-bottom:2px solid var(--primary)}
    .loading-row{opacity:.6;background:#eee!important}
    @media(max-width:600px){.toolbar{flex-direction:column}button{width:100%;justify-content:center}}
  </style>
</head>
<body>
<main>
  <h1>🎬 TikTok Report Video</h1>
  <div id="stats-board">
    <div class="stat-card"><div class="stat-title">Lượt Xem 👁️</div><div class="stat-value" id="total-view">0</div><div class="stat-avg" id="avg-view">TB: 0</div></div>
    <div class="stat-card"><div class="stat-title">Tim ❤️</div><div class="stat-value" id="total-like">0</div><div class="stat-avg" id="avg-like">TB: 0</div></div>
    <div class="stat-card"><div class="stat-title">Bình Luận 💬</div><div class="stat-value" id="total-cmt">0</div><div class="stat-avg" id="avg-cmt">TB: 0</div></div>
    <div class="stat-card"><div class="stat-title">Lưu 💾</div><div class="stat-value" id="total-save">0</div><div class="stat-avg" id="avg-save">TB: 0</div></div>
    <div class="stat-card"><div class="stat-title">Chia Sẻ 🔗</div><div class="stat-value" id="total-share">0</div><div class="stat-avg" id="avg-share">TB: 0</div></div>
  </div>

  <div>
    <label>📝 Dán Link Video (Mỗi dòng 1 link):</label>
    <textarea id="linkInput" placeholder="https://www.tiktok.com/@user/video/123456789&#10;https://vt.tiktok.com/..."></textarea>
  </div>

  <div class="toolbar">
    <button id="fetchBtn">🚀 Quét Data Ngay</button>
    <button class="btn-sec" id="clearBtn">🧹 Xoá Sạch</button>
    <button class="btn-sec" id="sampleBtn">📋 Dán Link Mẫu</button>
    <button class="btn-excel" id="exportBtn" disabled>📥 Xuất CSV</button>
    <button class="btn-copy" id="copyBtn" disabled>📎 Copy Nhanh</button>
  </div>

  <div id="status">👋 Sẵn sàng làm việc!</div>
  <span class="toggle-debug" onclick="toggleDebug()">🔍 Xem log kỹ thuật ▼</span>
  <div id="debug-log"></div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th style="width:44px">#</th><th>Ảnh</th><th>Kênh</th><th>Caption</th>
          <th>View</th><th>Like</th><th>Cmt</th><th>Save</th><th>Share</th>
          <th>Link</th><th>Status</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const fmt = n => (n||0).toLocaleString('vi-VN');
const sleep = ms => new Promise(r => setTimeout(r, ms));

let processedData = [];
let isProcessing = false;
let debugMode = false;

function log(msg, type='') { const el=$('status'); el.textContent=msg; el.className=type; }

function dlog(msg, cls='info') {
  const el=$('debug-log');
  const d=document.createElement('div');
  d.className=cls;
  d.textContent=`[${new Date().toLocaleTimeString()}] ${msg}`;
  el.appendChild(d);
  el.scrollTop=el.scrollHeight;
}

function toggleDebug() {
  debugMode=!debugMode;
  $('debug-log').style.display=debugMode?'block':'none';
  document.querySelector('.toggle-debug').textContent=debugMode?'🔍 Ẩn log kỹ thuật ▲':'🔍 Xem log kỹ thuật ▼';
}

function updateDashboard() {
  const valid=processedData.filter(i=>i.status==='OK');
  const n=valid.length;
  const sum=k=>valid.reduce((a,i)=>a+(i[k]||0),0);
  const avg=k=>n>0?fmt(Math.round(sum(k)/n)):'0';
  [['view','view'],['like','like'],['comment','cmt'],['save','save'],['share','share']].forEach(([k,id])=>{
    $('total-'+id).textContent=fmt(sum(k));
    $('avg-'+id).textContent='TB: '+avg(k);
  });
}

// ============================================================
// GỌI THẲNG TIKWM — không qua proxy, tikwm có CORS sẵn
// ============================================================
async function fetchVideo(url) {
  const apiUrl = `https://www.tikwm.com/api/?url=${encodeURIComponent(url)}&hd=1`;
  dlog(`Gọi thẳng: ${apiUrl.slice(0,80)}...`);

  const res = await fetch(apiUrl, { signal: AbortSignal.timeout(15000) });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);

  const data = await res.json();
  dlog(`Response code: ${data.code}, msg: ${data.msg}`);

  if (data.code !== 0) throw new Error(`TikWM: ${data.msg || 'error code '+data.code}`);
  if (!data.data) throw new Error('Không có data trong response');

  const d = data.data;
  dlog(`OK — @${d.author?.unique_id} | view=${d.play_count}`, 'ok');

  return {
    author:  d.author?.unique_id || 'unknown',
    avatar:  d.author?.avatar || d.cover || '',
    caption: d.title || '',
    view:    d.play_count    || 0,
    like:    d.digg_count    || 0,
    comment: d.comment_count || 0,
    save:    d.collect_count || 0,
    share:   d.share_count   || 0,
  };
}

// ============================================================
// LOGIC CHÍNH
// ============================================================
$('fetchBtn').addEventListener('click', async () => {
  if (isProcessing) return;
  const rawText = $('linkInput').value.trim();
  if (!rawText) { alert('Vui lòng nhập link!'); return; }

  const links = rawText.split('\n').map(l=>l.trim()).filter(Boolean);
  isProcessing=true; processedData=[]; $('tableBody').innerHTML=''; $('debug-log').innerHTML='';
  updateDashboard();
  $('fetchBtn').disabled=true; $('exportBtn').disabled=true; $('copyBtn').disabled=true;
  log(`🚀 Đang quét ${links.length} link...`, 'log-process');
  dlog(`Bắt đầu quét ${links.length} link — gọi thẳng tikwm.com`);

  for (let i=0; i<links.length; i++) {
    const link=links[i], rowId=i+1;
    createRowUI(rowId, link);
    log(`⏳ Xử lý ${rowId}/${links.length}...`, 'log-process');
    dlog(`--- Link ${rowId}: ${link}`);

    try {
      const parsed = await fetchVideo(link);
      const obj = { id:rowId, link, status:'OK', ...parsed };
      processedData.push(obj);
      updateRowUI(rowId, obj);
    } catch(err) {
      dlog(`FAIL: ${err.message}`, 'fail');
      processedData.push({ id:rowId, link, status:'ERROR', error:err.message });
      updateRowUI(rowId, { id:rowId, link, error:err.message }, true);
    }

    updateDashboard();
    if (i < links.length-1) await sleep(800);
  }

  isProcessing=false; $('fetchBtn').disabled=false;
  const ok=processedData.filter(d=>d.status==='OK').length;
  const err=processedData.filter(d=>d.status==='ERROR').length;
  $('exportBtn').disabled=ok===0;
  $('copyBtn').disabled=ok===0;
  log(`🎉 Xong! ${ok} thành công${err>0?`, ${err} lỗi`:'.'}.`, err>0?'log-error':'log-done');
  dlog(`Hoàn tất: ${ok} OK / ${err} lỗi`, ok>0?'ok':'fail');
});

function createRowUI(id, link) {
  const tr=document.createElement('tr');
  tr.id=`row-${id}`; tr.className='loading-row';
  tr.innerHTML=`<td>${id}</td><td class="col-thumb"><div style="width:40px;height:40px;background:#ddd;border-radius:6px"></div></td><td style="color:#999">đang tải...</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td>—</td><td class="col-link"><a href="${link}" target="_blank">Xem</a></td><td style="color:#aaa">...</td>`;
  $('tableBody').appendChild(tr);
}

function updateRowUI(id, data, isError=false) {
  const tr=$(`row-${id}`); if(!tr) return;
  tr.classList.remove('loading-row');
  if (isError) {
    tr.innerHTML=`<td>${id}</td><td colspan="8" style="color:#d50000;text-align:center;font-weight:700">⚠️ ${data.error||'Lỗi không xác định'}</td><td class="col-link"><a href="${data.link}" target="_blank">Link</a></td><td class="status-err">FAIL</td>`;
  } else {
    const cap=(data.caption||'').replace(/"/g,'&quot;');
    const avatar=data.avatar?`<img src="${data.avatar}" loading="lazy">`:`<div style="width:40px;height:40px;background:#eee;border-radius:6px"></div>`;
    tr.innerHTML=`<td>${id}</td><td class="col-thumb">${avatar}</td><td>@${data.author}</td><td class="col-caption" title="${cap}">${data.caption||''}</td><td>${fmt(data.view)}</td><td>${fmt(data.like)}</td><td>${fmt(data.comment)}</td><td>${fmt(data.save)}</td><td>${fmt(data.share)}</td><td class="col-link"><a href="${data.link}" target="_blank">Xem</a></td><td class="status-ok">OK</td>`;
  }
}

$('clearBtn').addEventListener('click', ()=>{
  $('linkInput').value=''; $('tableBody').innerHTML=''; $('debug-log').innerHTML='';
  processedData=[]; updateDashboard(); $('exportBtn').disabled=true; $('copyBtn').disabled=true; log('Đã dọn dẹp! 🧹');
});

$('sampleBtn').addEventListener('click', ()=>{
  $('linkInput').value=['https://www.tiktok.com/@letuankhang2002/video/7578120269450071304','https://www.tiktok.com/@letuankhang2002/video/7572146167778397447','https://vt.tiktok.com/ZSfGHPdRK/'].join('\n');
});

$('exportBtn').addEventListener('click', ()=>{
  if (!processedData.length) return;
  const headers=['STT','Kenh','Caption','View','Like','Comment','Save','Share','Link','Trang Thai'];
  const rows=processedData.map(item=>{
    if (item.status==='ERROR') return [item.id,'','ERROR',0,0,0,0,0,item.link,'ERROR'];
    const cap=`"${(item.caption||'').replace(/"/g,'""').replace(/\n/g,' ')}"`;
    return [item.id,item.author,cap,item.view,item.like,item.comment,item.save,item.share,item.link,'OK'];
  });
  const csv=[headers.join(','),...rows.map(r=>r.join(','))].join('\n');
  const blob=new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`TikTok_Report_${new Date().toISOString().slice(0,10)}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
});

// ============================================================
// COPY NHANH BẢNG DỮ LIỆU — dạng tab-separated, dán thẳng vào Excel/Sheets
// ============================================================
async function copyTableData() {
  if (!processedData.length) return;
  const headers=['STT','Kenh','Caption','View','Like','Comment','Save','Share','Link','Trang Thai'];
  const rows=processedData.map(item=>{
    if (item.status==='ERROR') return [item.id,'','ERROR',0,0,0,0,0,item.link,'ERROR'];
    const cap=(item.caption||'').replace(/\t/g,' ').replace(/\n/g,' ');
    return [item.id,item.author,cap,item.view,item.like,item.comment,item.save,item.share,item.link,'OK'];
  });
  const tsv=[headers.join('\t'),...rows.map(r=>r.join('\t'))].join('\n');

  const btn=$('copyBtn');
  const originalText=btn.textContent;
  try {
    await navigator.clipboard.writeText(tsv);
    btn.textContent='✅ Đã copy!';
  } catch(err) {
    // fallback cho trình duyệt/context không hỗ trợ Clipboard API
    try {
      const ta=document.createElement('textarea');
      ta.value=tsv; ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.focus(); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      btn.textContent='✅ Đã copy!';
    } catch(err2) {
      btn.textContent='⚠️ Lỗi copy';
      dlog(`Copy thất bại: ${err2.message}`, 'fail');
    }
  }
  setTimeout(()=>{ btn.textContent=originalText; }, 1600);
}

$('copyBtn').addEventListener('click', copyTableData);
</script>
</body>
</html>
